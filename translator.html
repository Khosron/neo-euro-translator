<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo Euro Translator</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            max-width: 650px; 
            margin: 40px auto; 
            padding: 0 20px; 
            background: #0f172a; 
            color: #f8fafc; 
        }
        h2, h3 { color: #ffffff; }
        textarea { 
            width: 100%; 
            height: 120px; 
            padding: 12px; 
            background: #1e293b; 
            color: #fff; 
            border: 1px solid #334155; 
            border-radius: 8px; 
            font-size: 16px; 
            resize: vertical; 
            box-sizing: border-box;
        }
        .controls {
            margin: 15px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #1d4ed8;
        }
        .shortcuts {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        .shortcut-chip {
            background: #1e3a8a;
            color: #93c5fd;
            border: 1px solid #3b82f6;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
        }
        .shortcut-chip:hover {
            background: #2563eb;
            color: #fff;
        }
        .direction-label {
            font-size: 14px;
            color: #93c5fd;
        }
        .output-container {
            position: relative;
            margin-top: 10px;
        }
        .output { 
            padding: 14px; 
            background: #1e293b; 
            border: 1px solid #334155; 
            border-radius: 8px; 
            min-height: 60px; 
            font-size: 16px; 
            word-break: break-word; 
        }
        .copy-btn {
            margin-top: 10px;
            background: #047857;
        }
        .copy-btn:hover {
            background: #065f46;
        }
    </style>
</head>
<body>
    <h2>Neo Euro Translator</h2>
    <p>Type text below (2-way translation & tense support active):</p>
    
    <textarea id="inputText" placeholder="Type here..."></textarea>
    
    <!-- Everyday Phrases Shortcuts -->
    <div class="shortcuts">
        <span style="font-size: 13px; color: #94a3b8; align-self: center;">Everyday Phrases:</span>
        <button class="shortcut-chip" onclick="insertShortcut('how are you')">how are you</button>
        <button class="shortcut-chip" onclick="insertShortcut('where are you going')">where are you going</button>
        <button class="shortcut-chip" onclick="insertShortcut('see you tomorrow')">see you tomorrow</button>
        <button class="shortcut-chip" onclick="insertShortcut('thank you')">thank you</button>
    </div>

    <div class="controls">
        <button id="toggleBtn" onclick="toggleDirection()">Switch Direction</button>
        <span id="directionLabel" class="direction-label">English ➔ Neo-Euro</span>
    </div>

    <h3>Translation:</h3>
    <div class="output-container">
        <div id="outputText" class="output"></div>
    </div>
    <button class="copy-btn" onclick="copyTranslation()">Copy Translation</button>

    <script>
        let dictionaryData = null;
        let reverseDictionary = {};
        let isNeoEuroToEnglish = false;

        async function loadDictionary() {
            try {
                const response = await fetch('dictionary.json');
                dictionaryData = await response.json();
                
                if (dictionaryData.vocabulary) {
                    for (let [eng, neo] of Object.entries(dictionaryData.vocabulary)) {
                        // Map both ways cleanly so every neo word points to its english meaning
                        if (!reverseDictionary[neo]) {
                            reverseDictionary[neo] = eng;
                        }
                    }
                }
            } catch (error) {
                console.error("Failed to load dictionary.json:", error);
                document.getElementById('outputText').innerText = "Error: Could not load dictionary.json via local server.";
            }
        }

        loadDictionary();

        function insertShortcut(text) {
            const input = document.getElementById('inputText');
            input.value = text;
            triggerTranslation();
        }

        function toggleDirection() {
            isNeoEuroToEnglish = !isNeoEuroToEnglish;
            const label = document.getElementById('directionLabel');
            const inputField = document.getElementById('inputText');
            
            if (isNeoEuroToEnglish) {
                label.innerText = "Neo-Euro ➔ English";
                inputField.placeholder = "Type Neo-Euro here... (e.g., ichos epithymeinros)";
            } else {
                label.innerText = "English ➔ Neo-Euro";
                inputField.placeholder = "Type English here... (e.g., please dont leave me)";
            }
            triggerTranslation();
        }

        function translateText(inputText) {
            if (!dictionaryData) return "";

            let text = inputText.toLowerCase();

            if (!isNeoEuroToEnglish) {
                // English -> Neo-Euro
                if (dictionaryData.contractions) {
                    const sorted = Object.keys(dictionaryData.contractions).sort((a, b) => b.length - a.length);
                    for (let contraction of sorted) {
                        let expansion = dictionaryData.contractions[contraction];
                        let regex = new RegExp(`\\b${contraction}\\b`, 'gi');
                        text = text.replace(regex, expansion);
                    }
                }

                let words = text.split(/\s+/);
                let translated = words.map(word => {
                    let punctMatch = word.match(/[.,!?;:]+$/);
                    let punct = punctMatch ? punctMatch[0] : '';
                    let coreWord = punct ? word.slice(0, -punct.length) : word;

                    if (dictionaryData.vocabulary[coreWord]) {
                        return dictionaryData.vocabulary[coreWord] + punct;
                    }
                    return word;
                });
                return translated.join(' ');

            } else {
                // Neo-Euro -> English
                let words = text.split(/\s+/);
                let translated = words.map(word => {
                    let punctMatch = word.match(/[.,!?;:]+$/);
                    let punct = punctMatch ? punctMatch[0] : '';
                    let coreWord = punct ? word.slice(0, -punct.length) : word;

                    // Clean up tense suffixes if present
                    let cleanCore = coreWord.replace(/-enon$|-ens$|-ei$/, '');

                    if (reverseDictionary[cleanCore]) {
                        return reverseDictionary[cleanCore] + punct;
                    }
                    return word;
                });
                return translated.join(' ');
            }
        }

        function triggerTranslation() {
            const rawText = document.getElementById('inputText').value;
            if (!rawText.trim()) {
                document.getElementById('outputText').innerText = "";
                return;
            }
            const result = translateText(rawText);
            document.getElementById('outputText').innerText = result;
        }

        function copyTranslation() {
            const outputText = document.getElementById('outputText').innerText;
            if (!outputText) return;
            navigator.clipboard.writeText(outputText).then(() => {
                const btn = document.querySelector('.copy-btn');
                btn.innerText = "Copied!";
                setTimeout(() => { btn.innerText = "Copy Translation"; }, 2000);
            });
        }

        document.getElementById('inputText').addEventListener('input', triggerTranslation);
    </script>
</body>
</html>
